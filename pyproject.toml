[project]
name = "shelly-ha-extras"
version = "0.1.0"
description = "Shelly Home Assistant Extras: safe firmware updates and MQTT entities for Gen2+ devices"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Shelly Updater contributors"}]
dependencies = [
  "httpx>=0.27,<1",
  "paho-mqtt>=2,<3",
  "typer>=0.12,<1",
  "websockets>=13,<16",
  "zeroconf>=0.132,<1",
]

[project.scripts]
shelly-ha-extras = "shelly_ha_extras.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelly_ha_extras"]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
